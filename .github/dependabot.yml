version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      svelte:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-*"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "typescript"
          - "vitest"
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker"
