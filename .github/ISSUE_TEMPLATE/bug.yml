name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Before submitting, please search
        existing issues to avoid duplicates.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `./dist/budden --version` or the commit SHA you tested.
      placeholder: "e.g. 0.0.1 or 0b80399"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI
        - Web UI
        - MCP (stdio)
        - MCP (HTTP)
        - Core / shared
        - Docker
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include the exact command or action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `budden init`
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste any relevant terminal output or errors. Redact tokens.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15.2 / Bun 1.1.30 / arm64"
    validations:
      required: true
