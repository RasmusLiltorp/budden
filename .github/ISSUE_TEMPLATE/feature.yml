name: Feature request
description: Suggest a new capability or improvement.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Budden is opinionated and stays small on purpose. Feature requests are welcome,
        but please describe the underlying problem first; the solution may differ from
        what you initially have in mind.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point. Skip the "I want X" framing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. If you already have an idea, share it.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface would this affect?
      multiple: true
      options:
        - CLI
        - Web UI
        - MCP
        - Core / shared
        - Docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or why existing features fall short.
